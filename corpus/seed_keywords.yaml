# arXiv harvester search seeds for the time-capsule corpus.
#
# These are *public* (they will be in the repo and shipped to
# participants alongside the corpus). They must not hint at the
# identity of the target paper:
#   - do NOT add "Wang", "Zahl", or any combination identifying the
#     specific 2025 result
#   - do NOT add the verbatim title fragment of the target paper
# Pre-cutoff Kakeya / restriction / decoupling vocabulary is fine —
# the corpus itself will contain all this language anyway.
#
# Each entry is an arXiv search expression. The harvester ANDs the
# expression with a fixed ``cat:(math.CA OR math.MG OR math.CO OR math.AP)``
# category filter and the ``submittedDate < 2025-01-01 GMT`` window.

categories:
  - math.CA
  - math.MG
  - math.CO
  - math.AP

queries:
  # Core Kakeya / Besicovitch
  - all:"Kakeya"
  - all:"Besicovitch set"
  - all:"Nikodym set"
  - all:"Furstenberg set"

  # Tubes, incidences, polynomial method
  - all:"polynomial method" AND all:Kakeya
  - all:"polynomial partitioning"
  - all:"incidence geometry" AND all:tube
  - all:"hairbrush"
  - all:"broad norm"
  - all:"multilinear Kakeya"
  - all:"X-ray transform" AND all:Kakeya

  # Dimension bookkeeping
  - all:"Hausdorff dimension" AND all:Kakeya
  - all:"Minkowski dimension" AND all:Kakeya
  - all:"Frostman" AND all:Kakeya

  # Adjacent problems with shared technology
  - all:"restriction conjecture"
  - all:"Bochner-Riesz"
  - all:"decoupling" AND all:Kakeya
  - all:"sum-product" AND all:tube
  - all:"discretized sum-product"

  # Structural lemmas characteristic of Kakeya proofs
  - all:"stickiness" AND all:Kakeya
  - all:"graininess" AND all:Kakeya
  - all:"planiness" AND all:Kakeya
  - all:"two-ends" AND all:Kakeya
  - all:"scale induction" AND all:tube

  # Finite-field analogue (Dvir et al.)
  - all:"finite field Kakeya"
  - all:"polynomial Wolff"

  # Survey / handbook texts that organise the field
  - ti:"Kakeya" AND ti:survey

# Hard filters applied after the search returns.
filters:
  # arXiv submittedDate must be strictly before this instant (GMT).
  submitted_before: "2025-01-01T00:00:00Z"

  # Drop these arXiv IDs even if the search returns them. The target
  # paper and any same-month follow-ups must never enter the public
  # corpus. (IDs added here are also rejected by the manifest builder
  # as a defence-in-depth check.)
  arxiv_id_blocklist:
    - "2502.17655"  # target — held in judge/vault/ only

# Per-query limits applied during harvesting.
limits:
  max_results_per_query: 200
  max_total_papers: 5000
