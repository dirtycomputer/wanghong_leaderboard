# Build the public leaderboard static site from ``submissions/`` and deploy
# it to GitHub Pages. Runs on every push to main that touches one of:
#   - submissions/**                  (new or updated evaluation_report.json)
#   - leaderboard/**                  (renderer or aggregator change)
#   - scripts/build_leaderboard.py    (CLI change)
#   - .github/workflows/leaderboard.yml (workflow self-update)
# Also exposes ``workflow_dispatch`` so an operator can rebuild on demand.

name: Leaderboard

on:
  push:
    branches: [main]
    paths:
      - "submissions/**"
      - "leaderboard/**"
      - "scripts/build_leaderboard.py"
      - ".github/workflows/leaderboard.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Build site
        run: |
          python -m scripts.build_leaderboard \
              --reports submissions \
              --out site \
              --title "Wang Hong (3D Kakeya) Leaderboard"
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
