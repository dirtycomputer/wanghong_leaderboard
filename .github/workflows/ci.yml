# Continuous integration: lint + tests on every push to main and every PR.
# Kept tight on purpose — no live OpenRouter, Exa, or judge calls happen here.
# Integration paths in the suite use injected fakes.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff
        run: ruff check proxy scripts tests runner judge leaderboard harnesses/tools
      - name: Pytest
        run: pytest -q
