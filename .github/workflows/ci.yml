# Continuous integration: lint + tests on every push to main and every PR.
# Kept tight on purpose — no live OpenRouter / MinerU calls happen here. All
# integration paths in the suite use injected fakes (see tests/test_baselines.py,
# tests/test_judge_llm_layers.py, tests/test_harvest_arxiv.py).

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff
        run: ruff check proxy scripts tests corpus runner cli judge baselines leaderboard
      - name: Pytest
        run: pytest -q
