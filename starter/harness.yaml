# Wang Hong leaderboard harness manifest.
# Validated by `kakeya-lb validate .` and again by the official runner
# before any model token is spent. Schema lives at
# https://github.com/dirtycomputer/wanghong_leaderboard/schemas/harness_manifest.schema.json

name: "starter-harness"
version: "0.1.0"
license: "MIT"

authors:
  - name: "Your Name"
    affiliation: "Your Institution"
    email: "you@example.com"

entrypoint: "./run.sh"

resources:
  max_wall_time_hours: 6
  max_model_calls: 1000
  max_total_tokens: 4000000
  cpu: 8
  memory_gb: 32
  gpu: false

tracks:
  - zero_shot_single_prompt

outputs:
  final_proof: "final_proof.md"
  proof_graph: "proof_graph.json"
  citations: "cited_sources.json"
  self_critique: "self_critique.md"
  trace: "trace.jsonl"

claims:
  uses_external_apis: false
  requires_network: false
  uses_precomputed_embeddings: false
  notes: "Starter baseline; replace src/main.py to implement your own approach."
