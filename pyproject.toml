[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wanghong-leaderboard"
version = "0.0.1"
description = "Time-capsule leaderboard evaluating whether harnesses can independently reach a proof-level solution to the 3D Kakeya set conjecture."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "wanghong-leaderboard maintainers" }]

dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pyyaml>=6.0",
    "orjson>=3.10",
    "tenacity>=8.3",
    "python-dotenv>=1.0",
    "jsonschema>=4.22",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
wh-canary = "scripts.canary_gemma:main"
kakeya-lb = "runner.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = [
    "proxy*", "judge*", "runner*", "scripts*",
    "leaderboard*", "harnesses.tools*",
]
exclude = ["tests*", "judge.vault*"]

[tool.setuptools.package-data]
leaderboard = ["static/*.css"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
